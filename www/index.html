<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jarvis AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body { background: #0b0f19; color: #fff; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 16px; background: #111827; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; }
  h2 { font-size: 17px; color: #38bdf8; }
  .key-btn { background: #1f2937; color: #38bdf8; border: 1px solid #374151; padding: 5px 10px; border-radius: 12px; font-size: 12px; cursor: pointer; }
  #keyBox { display: none; padding: 10px; background: #1f2937; gap: 8px; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
  .user { background: #0284c7; align-self: flex-end; border-bottom-right-radius: 2px; }
  .bot { background: #1f2937; align-self: flex-start; border-bottom-left-radius: 2px; }
  .bar { padding: 10px 12px; background: #111827; display: flex; gap: 8px; border-top: 1px solid #1f2937; }
  input { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #374151; background: #0b0f19; color: #fff; outline: none; }
  button.send { background: #38bdf8; border: none; width: 42px; height: 42px; border-radius: 50%; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h2>Jarvis (Kanpuria AI)</h2>
  <button class="key-btn" onclick="toggleKey()">🔑 API Key</button>
</header>
<div id="keyBox">
  <input type="text" id="kInp" placeholder="Paste Gemini API Key here...">
  <button class="key-btn" onclick="saveKey()">Save</button>
</div>
<div id="chat">
  <div class="msg bot">Arrey Aadi guru! Ka scene hai, batao ka chal raha?</div>
</div>
<div class="bar">
  <input type="text" id="t" placeholder="Boliye ya likhein..." onkeypress="if(event.key==='Enter') send()">
  <button class="send" onclick="send()">➤</button>
</div>
<script>
let defaultKey = atob("QVEuQWI4Uk42SXpHY1pCRXdKQXVCWGhWc1d2VDVTb1NwSHVoSUFYRGRjZk9MUk5oYVgyMXc=");
let key = localStorage.getItem("API_KEY") || defaultKey || "";
let activeModel = "";

function toggleKey() {
  let b = document.getElementById("keyBox");
  b.style.display = b.style.display === "flex" ? "none" : "flex";
  document.getElementById("kInp").value = key;
}
function saveKey() {
  key = document.getElementById("kInp").value.trim();
  localStorage.setItem("API_KEY", key);
  activeModel = "";
  document.getElementById("keyBox").style.display = "none";
  addMsg("API Key save ho gayi guru!", "bot");
}

async function getModel() {
  if (activeModel) return activeModel;
  let r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?key=" + key);
  let d = await r.json();
  if (!d.models) throw new Error(d.error ? d.error.message : "Invalid API Key");
  let ms = d.models.map(m => m.name).filter(n => n.includes("flash") && !n.includes("2.5"));
  activeModel = ms[0] || "models/gemini-2.0-flash";
  return activeModel;
}

let chat = [
  {role:"user", parts:[{text:"Tu Aadi ki pakki Kanpuria female friend Jarvis hai. Super fast, natural Hinglish mein sirf 1 chhota sentence bol. Chill aur theth Kanpuria andaz rakh. No emoji, no stars."}]},
  {role:"model", parts:[{text:"Haan Aadi guru bol, ka scene hai?"}]}
];

async function send() {
  let inp = document.getElementById("t");
  let msg = inp.value.trim();
  if(!msg) return;
  if(!key) { toggleKey(); addMsg("Upar box mein apni Gemini API Key daal ke Save karo!", "bot"); return; }
  inp.value = "";
  addMsg(msg, "user");
  chat.push({role:"user", parts:[{text:msg}]});
  try {
    let model = await getModel();
    let r = await fetch("https://generativelanguage.googleapis.com/v1beta/" + model + ":generateContent?key=" + key, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:chat.slice(-6), generationConfig:{maxOutputTokens:60, temperature:0.75}})
    });
    let d = await r.json();
    if (!d.candidates || !d.candidates[0]) {
      throw new Error(d.error ? d.error.message : "No response from API");
    }
    let ans = d.candidates[0].content.parts[0].text.trim();
    addMsg(ans, "bot");
    chat.push({role:"model", parts:[{text:ans}]});
    speak(ans);
  } catch(e) {
    chat.pop();
    addMsg("Error: " + e.message, "bot");
  }
}

function speak(txt) {
  try {
    let u = "https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=hi&q=" + encodeURIComponent(txt);
    new Audio(u).play();
  } catch(e) {}
}

function addMsg(txt, cls) {
  let c = document.getElementById("chat");
  let d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerText = txt;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}
</script>
</body>
</html>
