<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>Aaru AI Studio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: #0b0914; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Drawer */
  #drawerOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 900; display: none; }
  #drawer { position: fixed; top: 0; left: -290px; width: 280px; height: 100vh; background: #130e21; border-right: 1px solid #2e2147; z-index: 950; display: flex; flex-direction: column; transition: left 0.25s ease; }
  #drawer.open { left: 0; }
  .drawer-head { padding: 14px; border-bottom: 1px solid #2e2147; display: flex; justify-content: space-between; align-items: center; }
  .new-chat-btn { margin: 10px; padding: 10px 14px; background: #db2777; color: #fff; border: none; border-radius: 12px; font-weight: bold; font-size: 13px; cursor: pointer; }
  #chatList { flex: 1; overflow-y: auto; padding: 6px 10px; display: flex; flex-direction: column; gap: 6px; }
  .chat-item { padding: 10px; border-radius: 10px; background: #1e162e; color: #e2e8f0; font-size: 13px; cursor: pointer; }
  .chat-item.active { border: 1px solid #f472b6; background: #2a1b3d; }

  /* Header & Status Bar */
  header { padding: 10px 12px; background: #161124; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2e2147; }
  .left-head { display: flex; align-items: center; gap: 8px; }
  .menu-btn { background: #241b35; color: #fff; border: 1px solid #3b2d54; width: 34px; height: 34px; border-radius: 9px; font-size: 17px; cursor: pointer; }
  .title { font-size: 15px; font-weight: bold; color: #f472b6; display: flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #22c55e; }
  .top-btns { display: flex; gap: 5px; }
  .btn-sm { background: #241b35; color: #f1f5f9; border: 1px solid #3b2d54; padding: 6px 9px; border-radius: 11px; font-size: 11px; cursor: pointer; }
  .btn-sm.active { background: #db2777; color: #fff; border-color: #f472b6; }
  .btn-studio { background: linear-gradient(90deg, #0284c7, #7c3aed); color: #fff; border: none; font-weight: bold; }

  .status-bar { background: #120d1e; padding: 6px 10px; font-size: 11px; color: #cbd5e1; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #241b35; gap: 6px; overflow-x: auto; white-space: nowrap; }
  .badge { background: #1e162e; border: 1px solid #3b2d54; padding: 4px 8px; border-radius: 8px; color: #f472b6; font-weight: 600; cursor: pointer; }

  #keyBox, #scheduleModal { display: none; padding: 10px; background: #241b35; gap: 8px; border-bottom: 1px solid #3b2d54; align-items: center; flex-wrap: wrap; }

  /* Kotlin & Flutter Idea-to-App Studio Modal */
  #studioModal { position: fixed; inset: 0; background: #0b0914; z-index: 2000; display: none; flex-direction: column; }
  .studio-head { padding: 12px 14px; background: #161124; border-bottom: 1px solid #2e2147; display: flex; justify-content: space-between; align-items: center; }
  .studio-bar { padding: 10px; background: #120d1e; display: flex; gap: 6px; border-bottom: 1px solid #241b35; }
  .studio-inp { flex: 1; padding: 10px 12px; border-radius: 12px; border: 1px solid #3b2d54; background: #0b0914; color: #fff; font-size: 13px; outline: none; }
  .studio-tabs { display: flex; background: #161124; border-bottom: 1px solid #2e2147; }
  .s-tab { flex: 1; padding: 10px; text-align: center; font-size: 12px; font-weight: bold; color: #94a3b8; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; }
  .s-tab.active { color: #38bdf8; border-bottom-color: #38bdf8; background: #1e162e; }
  .studio-body { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  #liveAppFrame { width: 100%; height: 100%; border: none; background: #fff; }
  .code-view { display: none; width: 100%; height: 100%; overflow: auto; padding: 12px; background: #090710; color: #38bdf8; font-family: monospace; font-size: 12px; white-space: pre-wrap; line-height: 1.45; }
  .studio-foot { padding: 8px 12px; background: #161124; border-top: 1px solid #2e2147; display: flex; justify-content: space-between; gap: 8px; }

  /* Chat Area */
  #chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 10px 14px; border-radius: 15px; font-size: 15px; line-height: 1.45; word-wrap: break-word; white-space: pre-wrap; }
  .user { background: #db2777; align-self: flex-end; border-bottom-right-radius: 3px; color: #fff; }
  .bot { background: #1e162e; align-self: flex-start; border-bottom-left-radius: 3px; border: 1px solid #3b2d54; }
  .bar { padding: 9px; background: #161124; display: flex; align-items: center; gap: 6px; border-top: 1px solid #2e2147; }
  #t { flex: 1; padding: 10px 14px; border-radius: 22px; border: 1px solid #3b2d54; background: #0b0914; color: #fff; outline: none; font-size: 14px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: #241b35; color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .icon-btn.listening { background: #ef4444; animation: pulse 1s infinite; }
  .send-btn { background: #f472b6; color: #000; font-weight: bold; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
</style>

<body>

<div id="drawerOverlay" onclick="toggleDrawer()"></div>
<div id="drawer">
  <div class="drawer-head">
    <span style="font-weight:bold;color:#f472b6;">💬 Saved Chats</span>
    <button class="btn-sm" onclick="toggleDrawer()">✕</button>
  </div>
  <button class="new-chat-btn" onclick="startNewChat()">＋ New Chat</button>
  <div id="chatList"></div>
</div>

<!-- KOTLIN & DART (FLUTTER) IDEA-TO-APP STUDIO -->
<div id="studioModal">
  <div class="studio-head">
    <span style="font-weight:bold;color:#38bdf8;font-size:15px;">🚀 Kotlin & Flutter App Builder</span>
    <button class="btn-sm" onclick="closeStudio()">✕ Close</button>
  </div>
  <div class="studio-bar">
    <input type="text" id="appIdeaInp" class="studio-inp" placeholder="Apna App Idea likho (e.g. Gold GST Calculator, Game, Todo)...">
    <button class="btn-sm btn-studio" onclick="buildAppFromIdea()">⚡ Build App</button>
  </div>
  <div class="studio-tabs">
    <button id="tabPreview" class="s-tab active" onclick="switchStudioTab('preview')">▶️ Live App</button>
    <button id="tabFlutter" class="s-tab" onclick="switchStudioTab('flutter')">🎯 Dart (Flutter)</button>
    <button id="tabKotlin" class="s-tab" onclick="switchStudioTab('kotlin')">🤖 Kotlin (Android)</button>
  </div>
  <div class="studio-body">
    <iframe id="liveAppFrame" sandbox="allow-scripts allow-forms allow-modals"></iframe>
    <pre id="flutterCodeView" class="code-view"></pre>
    <pre id="kotlinCodeView" class="code-view"></pre>
  </div>
  <div class="studio-foot">
    <button class="btn-sm" onclick="copyStudioCode()">📋 Copy Code</button>
    <button class="btn-sm active" onclick="downloadGeneratedApp()">📥 Download Installable App</button>
  </div>
</div>

<header>
  <div class="left-head">
    <button class="menu-btn" onclick="toggleDrawer()">☰</button>
    <div class="title"><span class="dot"></span> Aaru 💖</div>
  </div>
  <div class="top-btns">
    <button class="btn-sm btn-studio" onclick="openStudio('')">📱 Make App</button>
    <button id="autoMicBtn" class="btn-sm" onclick="toggleAutoChat()">🎙️ Auto-Chat: OFF</button>
    <button class="btn-sm" onclick="toggleKey()">🔑 Key</button>
  </div>
</header>

<div class="status-bar">
  <span id="stepBadge" class="badge" onclick="enableStepTracker()">👣 Steps: 0</span>
  <span class="badge" onclick="toggleScheduleModal()">⏰ Reminders (<span id="remCount">0</span>)</span>
  <span class="badge" onclick="requestAllPermissions()">🔔 Perms</span>
  <span class="badge" onclick="summarizeChat()">📝 Summarize</span>
</div>

<div id="keyBox">
  <input type="text" id="kInp" style="flex:1;padding:7px 10px;border-radius:8px;border:1px solid #475569;background:#0b0914;color:#fff;" placeholder="Gemini Key (AIzaSy...)">
  <button class="btn-sm active" onclick="saveKey()">Save</button>
</div>

<div id="scheduleModal">
  <div style="width:100%;display:flex;justify-content:space-between;">
    <span style="font-size:12px;color:#4ade80;font-weight:bold;">⏰ Active Reminders (e.g. remind 5:30 PM workout):</span>
    <button class="btn-sm" onclick="toggleScheduleModal()">Close</button>
  </div>
  <div id="schedList" style="width:100%;font-size:12px;margin-top:4px;"></div>
</div>

<div id="chat"></div>

<div class="bar">
  <button id="micBtn" class="icon-btn" onclick="startSingleMic()" title="Voice Input">🎤</button>
  <input type="text" id="t" placeholder="Aadi, yahan likho ya 'make app' bolo..." onkeypress="if(event.key==='Enter') send(false)">
  <button class="icon-btn send-btn" onclick="send(false)">➤</button>
</div>

<script>
let defaultKey = "";
try { defaultKey = atob("").trim(); } catch(e) {}
let key = (localStorage.getItem("API_KEY") || defaultKey || "").trim();

function toggleKey() {
  let b = document.getElementById("keyBox");
  b.style.display = b.style.display === "flex" ? "none" : "flex";
  document.getElementById("kInp").value = key;
}
function saveKey() {
  key = document.getElementById("kInp").value.trim();
  localStorage.setItem("API_KEY", key);
  document.getElementById("keyBox").style.display = "none";
  addMsgToUI("Key save ho gayi Aadi!", "bot", true);
}

// 1. DAILY STEP TRACKER
let stepDay = new Date().toDateString();
if (localStorage.getItem("STEP_DAY") !== stepDay) {
  localStorage.setItem("STEP_DAY", stepDay);
  localStorage.setItem("AARU_STEPS", "0");
}
let steps = parseInt(localStorage.getItem("AARU_STEPS") || "0", 10);
let lastStepTime = 0;

function updateStepUI() {
  document.getElementById("stepBadge").innerText = "👣 Steps: " + steps;
}
updateStepUI();

function enableStepTracker() {
  if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
    DeviceMotionEvent.requestPermission().then(res => {
      if (res === "granted") startMotionListener();
    }).catch(()=>{});
  } else {
    startMotionListener();
  }
  addMsgToUI("👣 Step Tracker active hai Aadi!", "bot", false);
}

function startMotionListener() {
  window.addEventListener("devicemotion", (e) => {
    let acc = e.accelerationIncludingGravity;
    if (!acc) return;
    let mag = Math.sqrt((acc.x||0)**2 + (acc.y||0)**2 + (acc.z||0)**2);
    let now = Date.now();
    if (mag > 13.2 && (now - lastStepTime) > 380) {
      steps++;
      lastStepTime = now;
      localStorage.setItem("AARU_STEPS", String(steps));
      updateStepUI();
    }
  });
}
startMotionListener();

// 2. REMINDERS & PERMISSIONS
let schedules = JSON.parse(localStorage.getItem("AARU_SCHEDULES") || "[]");

async function requestAllPermissions() {
  try { if ("Notification" in window) await Notification.requestPermission(); } catch(e){}
  try {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      let s = await navigator.mediaDevices.getUserMedia({ audio: true });
      s.getTracks().forEach(t => t.stop());
    }
  } catch(e){}
  enableStepTracker();
  addMsgToUI("✅ Mic, Notification aur Step Tracker permissions active ho gayi hain Aadi!", "bot", false);
}

function updateScheduleCount() {
  document.getElementById("remCount").innerText = schedules.length;
  let list = document.getElementById("schedList");
  list.innerHTML = schedules.length === 0 ? "Koi reminder nahi hai." :
    schedules.map((s, i) => "<div style='padding:3px 0;display:flex;justify-content:space-between;'><span>⏰ " + s.task + " (" + s.time + ")</span><button class='btn-sm' onclick='removeSched(" + i + ")'>✕</button></div>").join("");
}
function removeSched(i) {
  schedules.splice(i, 1);
  localStorage.setItem("AARU_SCHEDULES", JSON.stringify(schedules));
  updateScheduleCount();
}
function toggleScheduleModal() {
  let m = document.getElementById("scheduleModal");
  m.style.display = m.style.display === "flex" ? "none" : "flex";
  updateScheduleCount();
}

function detectAndSchedule(msg) {
  let m = msg.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/i);
  if (m && /\b(remind|reminder|meet|alarm|yaad|schedule)\b/i.test(msg)) {
    let hr = parseInt(m[1], 10);
    let min = m[2] ? parseInt(m[2], 10) : 0;
    let ampm = (m[3] || "").toLowerCase();
    if (ampm === "pm" && hr < 12) hr += 12;
    if (ampm === "am" && hr === 12) hr = 0;
    let time24 = String(hr).padStart(2, "0") + ":" + String(min).padStart(2, "0");
    schedules.push({ task: msg, time: time24, fired: false });
    localStorage.setItem("AARU_SCHEDULES", JSON.stringify(schedules));
    updateScheduleCount();
    return time24;
  }
  return null;
}

setInterval(() => {
  let now = new Date();
  let cur = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  schedules.forEach(s => {
    if (!s.fired && s.time === cur) {
      s.fired = true;
      localStorage.setItem("AARU_SCHEDULES", JSON.stringify(schedules));
      if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("⏰ Aaru Reminder for Aadi!", { body: s.task });
      }
      addMsgToUI("⏰ REMINDER ALERT AADI: " + s.task, "bot", true);
      speakContinuous("Aadi, tumhara reminder time ho gaya hai: " + s.task);
    }
  });
}, 10000);

// 3. ALWAYS NEW CHAT ON OPEN
let allChats = JSON.parse(localStorage.getItem("AARU_SAVED_CHATS") || "[]").filter(c => c.messages && c.messages.length > 1);
let activeChatId = "";

function saveChatsToStorage() {
  localStorage.setItem("AARU_SAVED_CHATS", JSON.stringify(allChats));
  renderChatList();
}
function getActiveChat() {
  return allChats.find(c => c.id === activeChatId);
}
function createNewChatSession() {
  let id = "chat_" + Date.now();
  let newSession = {
    id: id,
    title: "New Chat",
    messages: [
      { role: "bot", text: "Hii Aadi! Main Aaru hoon 💖 Ab mujhme Kotlin aur Dart (Flutter) App Studio bhi jud gaya hai! Upar '📱 Make App' dabao ya mujhse kuch bhi pucho." }
    ]
  };
  allChats.unshift(newSession);
  activeChatId = id;
  saveChatsToStorage();
  loadChatToUI(id);
}
function startNewChat() { createNewChatSession(); toggleDrawer(false); }
function loadChatToUI(id) {
  activeChatId = id;
  let session = getActiveChat();
  let c = document.getElementById("chat");
  c.innerHTML = "";
  if (session) session.messages.forEach(m => addMsgToUI(m.text, m.role, false));
  renderChatList();
}
function renderChatList() {
  let list = document.getElementById("chatList");
  list.innerHTML = "";
  allChats.forEach(c => {
    let item = document.createElement("div");
    item.className = "chat-item" + (c.id === activeChatId ? " active" : "");
    item.onclick = () => { loadChatToUI(c.id); toggleDrawer(false); };
    item.innerHTML = "<span>💬 " + c.title + "</span>";
    list.appendChild(item);
  });
}
function toggleDrawer(force) {
  let d = document.getElementById("drawer");
  let o = document.getElementById("drawerOverlay");
  let isOpen = typeof force === "boolean" ? force : !d.classList.contains("open");
  d.classList.toggle("open", isOpen);
  o.style.display = isOpen ? "block" : "none";
}

// 4. KOTLIN & DART (FLUTTER) IDEA-TO-APP STUDIO ENGINE
let lastGeneratedHTML = "";
let lastAppIdea = "Aadi_Custom_App";

function openStudio(prefill) {
  document.getElementById("studioModal").style.display = "flex";
  if (prefill) {
    document.getElementById("appIdeaInp").value = prefill;
    buildAppFromIdea();
  } else if (!lastGeneratedHTML) {
    document.getElementById("appIdeaInp").value = "Gold & Jewellery GST Bill Calculator";
    buildAppFromIdea();
  }
}

function closeStudio() {
  document.getElementById("studioModal").style.display = "none";
}

function switchStudioTab(tab) {
  document.getElementById("tabPreview").classList.toggle("active", tab === "preview");
  document.getElementById("tabFlutter").classList.toggle("active", tab === "flutter");
  document.getElementById("tabKotlin").classList.toggle("active", tab === "kotlin");

  document.getElementById("liveAppFrame").style.display = tab === "preview" ? "block" : "none";
  document.getElementById("flutterCodeView").style.display = tab === "flutter" ? "block" : "none";
  document.getElementById("kotlinCodeView").style.display = tab === "kotlin" ? "block" : "none";
}

void main() => runApp(const AadiFlutterApp());

function generateKotlinTemplate(idea) {
  return `// Kotlin (Jetpack Compose Android) - Created by Aditya Soni (Aadi)
// Idea: ${idea}
package com.aditya.aaru.generated

import android.os.Bundle
import androidx.activity.ComponentActivity
import androidx.activity.compose.setContent
import androidx.compose.foundation.layout.*
import androidx.compose.material3.*
import androidx.compose.runtime.*
import androidx.compose.ui.Modifier
import androidx.compose.ui.unit.dp

class MainActivity : ComponentActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContent {
            MaterialTheme(colorScheme = darkColorScheme()) {
                Surface(modifier = Modifier.fillMaxSize()) {
                    AppScreen("${idea}")
                }
            }
        }
    }
}

@Composable
fun AppScreen(title: String) {
    var input by remember { mutableStateOf("") }
    var output by remember { mutableStateOf("Ready for Aadi!") }

    Column(modifier = Modifier.padding(16.dp)) {
        Text(text = title, style = MaterialTheme.typography.headlineSmall)
        Spacer(modifier = Modifier.height(12.dp))
        OutlinedTextField(
            value = input,
            onValueChange = { input = it },
            label = { Text("Enter Input") },
            modifier = Modifier.fillMaxWidth()
        )
        Spacer(modifier = Modifier.height(12.dp))
        Button(onClick = { output = "Result: \$input" }) {
            Text("Execute")
        }
        Spacer(modifier = Modifier.height(16.dp))
        Text(text = output, style = MaterialTheme.typography.bodyLarge)
    }
}`;
}

function generateInstantWorkingAppHTML(idea) {
  return `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
  .card { background: #1e293b; border-radius: 16px; padding: 18px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
  h2 { color: #38bdf8; font-size: 18px; margin-bottom: 6px; }
  .sub { font-size: 11px; color: #94a3b8; margin-bottom: 14px; }
  input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
  button { width: 100%; padding: 11px; border-radius: 10px; border: none; background: linear-gradient(90deg, #ec4899, #8b5cf6); color: #fff; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
  .out { margin-top: 12px; padding: 12px; background: #090d16; border-radius: 10px; border-left: 4px solid #22c55e; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <h2>⚡ ${idea}</h2>
    <div class="sub">Built with Aaru Flutter/Kotlin Engine by Aditya Soni</div>
    <input id="v1" type="number" placeholder="Amount / Weight (Grams) ya Number 1" value="10">
    <input id="v2" type="number" placeholder="Rate / Value 2 (e.g. Gold Rate)" value="7500">
    <button onclick="calc()">🚀 Calculate / Run Idea</button>
    <div id="res" class="out">Result yahan dikhega...</div>
  </div>
  <script>
    function calc() {
      let a = parseFloat(document.getElementById('v1').value) || 0;
      let b = parseFloat(document.getElementById('v2').value) || 0;
      let base = a * b;
      let gst = base * 0.03;
      let total = base + gst;
      document.getElementById('res').innerHTML =
        "<b>Base Value:</b> ₹" + base.toFixed(2) +
        "<br><b>GST (3%):</b> ₹" + gst.toFixed(2) +
        "<br><b>Grand Total:</b> ₹" + total.toFixed(2) +
        "<br><b>Addition (A+B):</b> " + (a + b);
    }
    calc();

// 5. CONTINUOUS VOICE FOR AUTO-CHAT ONLY
let autoChat = false;
let isSpeaking = false;
let ttsAudio = new Audio();

function speakContinuous(fullText) {
  if (!fullText) return;
  isSpeaking = true;
  if (rec) { try { rec.stop(); } catch(e){} }

  let clean = fullText
    .replace(/```[\s\S]*?```/g, " Code screen par de diya hai Aadi. ")
    .replace(/[!?\n]+/g, ", ")
    .replace(/[*#_~`💖🎨📷🔊]/g, "")
    .replace(/\s+/g, " ")
    .trim();

  let done = () => {
    isSpeaking = false;
    if (autoChat && rec) {
      setTimeout(() => { try { rec.start(); } catch(e){} }, 350);
    }
  };

  if (window.speechSynthesis) {
    try {
      window.speechSynthesis.cancel();
      let u = new SpeechSynthesisUtterance(clean);
      u.lang = "hi-IN";
      u.pitch = 1.28;
      u.rate = 1.12;
      u.onend = done;
      u.onerror = done;
      window.speechSynthesis.speak(u);
      return;
    } catch(e){}
  }

  let url = "https://translate.googleapis.com/translate_tts?client=tw-ob&ie=UTF-8&tl=hi&q=" + encodeURIComponent(clean.substring(0, 200));
  ttsAudio.src = url;
  ttsAudio.onended = done;
  ttsAudio.onerror = done;
  ttsAudio.play().catch(done);
}

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SpeechRec) {
  rec = new SpeechRec();
  rec.lang = "hi-IN";
  rec.interimResults = false;
  rec.onstart = () => document.getElementById("micBtn").classList.add("listening");
  rec.onend = () => {
    document.getElementById("micBtn").classList.remove("listening");
    if (autoChat && !isSpeaking) {
      setTimeout(() => { try { rec.start(); } catch(e){} }, 400);
    }
  };
  rec.onerror = () => {
    document.getElementById("micBtn").classList.remove("listening");
    if (autoChat && !isSpeaking) {
      setTimeout(() => { try { rec.start(); } catch(e){} }, 900);
    }
  };
  rec.onresult = (e) => {
    let txt = e.results[0][0].transcript;
    document.getElementById("t").value = txt;
    send(true);
  };
}

  await requestAllPermissions();

// 6. FAST PARALLEL AI ENGINE
const SYS_PROMPT = "Tumhara naam Aaru hai. Tumhe Aditya Soni ne banaya hai. User ko hamesha 'Aadi' bulao, kabhi 'bestie' mat bolna. Tumme Kotlin aur Dart (Flutter) App Studio built-in hai. Hamesha female grammar ('main kar rahi hoon', 'bataungi') mein Hinglish mein baat karo. Agar Aadi ke message mein typing mistake ho toh khud sahi matlab samajh kar turant jawab do.";

function cleanReply(txt) {
  return txt
    .replace(/\bbestie\b/gi, "Aadi")
    .replace(/Google ne banaya|trained by Google|OpenAI/gi, "Aditya Soni ne banaya")
    .replace(/\braha hoon\b/gi, "rahi hoon")
    .replace(/\braha hu\b/gi, "rahi hoon")
    .replace(/\bkarunga\b/gi, "karungi")
    .trim();
}

async function callModelRace(apiContents, lastMsg) {
  let tasks = [];
  if (key) {
    ["gemma-3-27b-it", "gemini-2.5-flash-lite", "gemini-2.5-flash"].forEach(m => {
      tasks.push((async () => {
        let bodyObj = m.startsWith("gemma")
          ? { contents: [{ role: "user", parts: [{ text: SYS_PROMPT + "\nAadi: " + lastMsg }] }] }
          : { systemInstruction: { parts: [{ text: SYS_PROMPT }] }, contents: apiContents };
        let r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + m + ":generateContent?key=" + key, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(bodyObj)
        });
        if (!r.ok) throw new Error("fail");
        let d = await r.json();
        let txt = d?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!txt || txt.length < 2) throw new Error("empty");
        return txt;
      })());
    });
  }

  tasks.push((async () => {
    let r = await fetch("https://text.pollinations.ai/openai", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        model: "openai",
        messages: [
          { role: "system", content: SYS_PROMPT },
          { role: "user", content: lastMsg }
        ]
      })
    });
    if (!r.ok) throw new Error("fail");
    let d = await r.json();
    let txt = d?.choices?.[0]?.message?.content;
    if (!txt || /404 Not Found/i.test(txt)) throw new Error("empty");
    return txt;
  })());

  return await Promise.any(tasks);
}

  let s = getActiveChat();
  if (!s || s.messages.length < 2) return;
  let txt = s.messages.slice(-8).map(m => m.text).join("\n");
  let ans = await callModelRace([], "Summarize in 3 short points for Aadi:\n" + txt);
  addMsgToUI("📝 Summary:\n" + cleanReply(ans), "bot", true);
}

async function send(fromVoice) {
  let inp = document.getElementById("t");
  let msg = inp.value.trim();
  if (!msg) return;

  if (msg.startsWith("AIzaSy") && msg.length > 30) {
    key = msg;
    localStorage.setItem("API_KEY", key);
    inp.value = "";
    addMsgToUI("API Key save ho gayi Aadi!", "bot", true);
    return;
  }

  inp.value = "";
  addMsgToUI(msg, "user", true);

  let session = getActiveChat();
  if (session && session.title === "New Chat") {
    session.title = msg.substring(0, 28);
    saveChatsToStorage();
  }

  // If user asks to build/make an app in chat, launch the Kotlin/Flutter Studio directly!
  if (/\b(app banao|make app|build app|apk banao|flutter app|kotlin app)\b/i.test(msg)) {
    let ideaClean = msg.replace(/app banao|make app|build app|apk banao|flutter app|kotlin app/gi, "").trim() || "Smart Utility App";
    addMsgToUI("🚀 Aadi, main tumhare idea ('" + ideaClean + "') ka Live App, Flutter (Dart) code aur Kotlin code Studio mein khol rahi hoon!", "bot", true);
    openStudio(ideaClean);
    return;
  }

  let remTime = detectAndSchedule(msg);
  if (remTime) {
    addMsgToUI("⏰ Aadi, maine " + remTime + " ka reminder set kar diya hai!", "bot", true);
  }

  if (/kisne banaya|who made you|creator|malik/i.test(msg)) {
    let cr = "Aadi, mujhe tumne (Aditya Soni ne) banaya hai!";
    addMsgToUI(cr, "bot", true);
    if (fromVoice || autoChat) speakContinuous(cr);
    return;
  }

  let apiContents = (session ? session.messages.slice(-5) : []).map(m => ({
    role: m.role === "user" ? "user" : "model",
    parts: [{ text: m.text }]
  }));

  let loader = addMsgToUI("...", "bot", false);

  try {
    let ans = await callModelRace(apiContents, msg);
    ans = cleanReply(ans);
    loader.remove();
    addMsgToUI(ans, "bot", true);
    if (fromVoice || autoChat) speakContinuous(ans);
  } catch(e) {
    loader.remove();
    addMsgToUI("Aadi, network check karo ya upar Key save karo.", "bot", false);
  }
}

function addMsgToUI(txt, role, save) {
  let c = document.getElementById("chat");
  let d = document.createElement("div");
  d.className = "msg " + role;
  d.innerText = txt;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
  if (save) {
    let s = getActiveChat();
    if (s) {
      s.messages.push({ role: role, text: txt });
      saveChatsToStorage();
    }
  }
  return d;
}
