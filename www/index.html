<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>Jarvis AI 3.8</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #090d16; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 12px 14px; background: #111827; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
  .title { font-size: 15px; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #22c55e; }
  .top-btns { display: flex; gap: 6px; }
  .btn-sm { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; padding: 6px 10px; border-radius: 14px; font-size: 12px; cursor: pointer; }
  .btn-sm.active { background: #059669; color: #fff; border-color: #10b981; }
  #keyBox { display: none; padding: 10px; background: #1e293b; gap: 8px; border-bottom: 1px solid #334155; }
  #chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.45; word-wrap: break-word; }
  .user { background: #0284c7; align-self: flex-end; border-bottom-right-radius: 3px; }
  .bot { background: #1e293b; align-self: flex-start; border-bottom-left-radius: 3px; border: 1px solid #334155; }
  .msg img, .msg canvas { max-width: 100%; border-radius: 10px; margin-top: 8px; display: block; }
  .edit-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { background: #0f172a; color: #38bdf8; border: 1px solid #38bdf8; padding: 5px 10px; border-radius: 10px; font-size: 12px; cursor: pointer; text-decoration: none; }
  .bar { padding: 10px; background: #111827; display: flex; align-items: center; gap: 6px; border-top: 1px solid #1e293b; }
  #t { flex: 1; padding: 10px 14px; border-radius: 22px; border: 1px solid #334155; background: #090d16; color: #fff; outline: none; font-size: 14px; }
  .icon-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: #1e293b; color: #fff; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .icon-btn.listening { background: #ef4444; animation: pulse 1s infinite; }
  .send-btn { background: #38bdf8; color: #000; font-weight: bold; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
</style>
</head>
<body>

<header>
  <div class="title"><span class="dot"></span> Jarvis 3.8 Pro</div>
  <div class="top-btns">
    <button id="autoMicBtn" class="btn-sm" onclick="toggleAutoMic()">🎙️ Auto-Mic: OFF</button>
    <button class="btn-sm" onclick="promptImageGen()">🎨 Create</button>
    <button class="btn-sm" onclick="toggleKey()">🔑 Key</button>
  </div>
</header>

<div id="keyBox">
  <input type="text" id="kInp" style="flex:1;padding:8px 12px;border-radius:8px;border:1px solid #475569;background:#090d16;color:#fff;" placeholder="Paste Gemini API Key (AIzaSy...)">
  <button class="btn-sm active" onclick="saveKey()">Save</button>
</div>

<div id="chat">
  <div class="msg bot">Hello Aditya! Jarvis 3.8 Pro (Zero-Fail Edition) ready hai. Ab server busy hone par bhi jawab turant aayega!</div>
</div>

<input type="file" id="imgUpload" accept="image/*" style="display:none" onchange="handleImageUpload(event)">

<div class="bar">
  <button class="icon-btn" onclick="document.getElementById('imgUpload').click()">📷</button>
  <button id="micBtn" class="icon-btn" onclick="startSingleMic()">🎤</button>
  <input type="text" id="t" placeholder="Boliye ya likhiye..." onkeypress="if(event.key==='Enter') send()">
  <button class="icon-btn send-btn" onclick="send()">➤</button>
</div>

<script>
let defaultKey = "";
try { defaultKey = atob("").trim(); } catch(e) {}
let key = (localStorage.getItem("API_KEY") || defaultKey || "").trim();
if (!key) document.getElementById("keyBox").style.display = "flex";

let autoMic = false;
let isSpeaking = false;
let currentPhotoBase64 = null;
let currentPhotoMime = "image/jpeg";
let currentAudio = null;

function toggleKey() {
  let b = document.getElementById("keyBox");
  b.style.display = b.style.display === "flex" ? "none" : "flex";
  document.getElementById("kInp").value = key;
}

function saveKey() {
  key = document.getElementById("kInp").value.trim();
  localStorage.setItem("API_KEY", key);
  document.getElementById("keyBox").style.display = "none";
  addMsg("API Key save ho gayi hai! Ab aap baat kar sakte hain.", "bot");
  speak("API Key save ho gayi hai, bataiye main kya madad karun?");
}

let chat = [
  {role:"user", parts:[{text:"You are Jarvis, Aditya's smart, polite, and super-fast personal AI assistant. Reply naturally in clear Hinglish (Hindi written in English script). Keep your answers concise (1 to 2 short sentences) so they can be spoken quickly and clearly. Do not use markdown asterisks or emojis."}]},
  {role:"model", parts:[{text:"Namaste Aditya! Main Jarvis hoon, bataiye aaj kya kaam karna hai?"}]}
];

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SpeechRec) {
  rec = new SpeechRec();
  rec.lang = "hi-IN";
  rec.interimResults = false;
  rec.onstart = () => document.getElementById("micBtn").classList.add("listening");
  rec.onend = () => {
    document.getElementById("micBtn").classList.remove("listening");
    if (autoMic && !isSpeaking) {
      setTimeout(() => { try { rec.start(); } catch(e){} }, 450);
    }
  };
  rec.onerror = () => {
    document.getElementById("micBtn").classList.remove("listening");
    if (autoMic && !isSpeaking) {
      setTimeout(() => { try { rec.start(); } catch(e){} }, 1000);
    }
  };
  rec.onresult = (e) => {
    let txt = e.results[0][0].transcript;
    document.getElementById("t").value = txt;
    send();
  };
}

async function requestMicPermission() {
  try {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(track => track.stop());
    }
  } catch(e) {}
}

async function toggleAutoMic() {
  await requestMicPermission();
  autoMic = !autoMic;
  let btn = document.getElementById("autoMicBtn");
  btn.innerText = autoMic ? "🎙️ Auto-Mic: ON" : "🎙️ Auto-Mic: OFF";
  btn.classList.toggle("active", autoMic);
  if (autoMic && rec) {
    try { rec.start(); } catch(e){}
  } else if (rec) {
    try { rec.stop(); } catch(e){}
  }
}

async function startSingleMic() {
  await requestMicPermission();
  if (!rec) {
    addMsg("Mic support ke liye App Settings mein Microphone permission allow karein.", "bot");
    return;
  }
  try { rec.start(); } catch(e) { try { rec.stop(); } catch(err){} }
}

function promptImageGen() {
  let p = document.getElementById("t").value.trim();
  if (!p) {
    document.getElementById("t").value = "photo banao ";
    document.getElementById("t").focus();
  } else {
    generateImage(p);
    document.getElementById("t").value = "";
  }
}

function generateImage(promptText) {
  let cleanPrompt = promptText.replace(/photo banao|image banao|pic banao|generate image|generate|draw/gi, "").trim() || "futuristic sports car";
  addMsg("🎨 Photo generate ho rahi hai: " + cleanPrompt, "bot");
  speak("Aapki photo generate ho rahi hai.");

  let seed = Math.floor(Math.random() * 999999);
  let imgUrl = "https://image.pollinations.ai/prompt/" + encodeURIComponent(cleanPrompt + ", masterpiece, ultra detailed, 8k resolution") + "?width=768&height=768&seed=" + seed + "&nologo=true";

  let c = document.getElementById("chat");
  let d = document.createElement("div");
  d.className = "msg bot";
  d.innerHTML = `Yeh lijiye aapki photo:<br><img src="${imgUrl}" crossorigin="anonymous"><div class="edit-bar"><a href="${imgUrl}" target="_blank" class="chip">⬇ Full HD Save</a></div>`;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}

function handleImageUpload(e) {
  let file = e.target.files[0];
  if (!file) return;
  currentPhotoMime = file.type || "image/jpeg";
  let reader = new FileReader();
  reader.onload = function(evt) {
    let dataUrl = evt.target.result;
    currentPhotoBase64 = dataUrl.split(",")[1];
    addPhotoEditorCard(dataUrl);
    speak("Photo load ho gayi hai. Aap niche filters se edit kar sakte hain ya is photo ke baare mein kuch bhi pooch sakte hain.");
  };
  reader.readAsDataURL(file);
}

function addPhotoEditorCard(dataUrl) {
  let c = document.getElementById("chat");
  let id = "canvas_" + Date.now();
  let d = document.createElement("div");
  d.className = "msg user";
  d.innerHTML = `Photo Studio:<br><canvas id="${id}"></canvas>
    <div class="edit-bar">
      <button class="chip" onclick="applyFilter('${id}','none')">Original</button>
      <button class="chip" onclick="applyFilter('${id}','contrast(1.28) saturate(1.35) brightness(1.05)')">✨ HD Boost</button>
      <button class="chip" onclick="applyFilter('${id}','sepia(0.35) contrast(1.2) saturate(1.4)')">🎬 Cinematic</button>
      <button class="chip" onclick="applyFilter('${id}','hue-rotate(190deg) saturate(1.8) contrast(1.2)')">🔮 Cyberpunk</button>
      <button class="chip" onclick="applyFilter('${id}','grayscale(1) contrast(1.4)')">🖤 B&W</button>
      <button class="chip" onclick="downloadCanvas('${id}')">⬇ Save Photo</button>
    </div>`;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;

  let cvs = document.getElementById(id);
  let ctx = cvs.getContext("2d");
  let img = new Image();
  img.onload = () => {
    cvs.width = img.width;
    cvs.height = img.height;
    cvs._origImg = img;
    ctx.drawImage(img, 0, 0);
  };
  img.src = dataUrl;
}

function applyFilter(id, flt) {
  let cvs = document.getElementById(id);
  if (!cvs || !cvs._origImg) return;
  let ctx = cvs.getContext("2d");
  ctx.filter = flt;
  ctx.drawImage(cvs._origImg, 0, 0);
}

function downloadCanvas(id) {
  let cvs = document.getElementById(id);
  let a = document.createElement("a");
  a.download = "Jarvis_Edited_" + Date.now() + ".jpg";
  a.href = cvs.toDataURL("image/jpeg", 0.95);
  a.click();
}

// Multi-Model + Backup Fallback so "High Demand" never blocks replies
async function getAIResponse(userMsg) {
  let modelsToTry = ["models/gemini-3.8-flash", "models/gemini-3.8-flash-lite", "models/gemini-3.8-pro"];
  
  for (let m of modelsToTry) {
    try {
      let r = await fetch("https://generativelanguage.googleapis.com/v1beta/" + m + ":generateContent?key=" + key, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          contents: chat.slice(-6),
          generationConfig: { maxOutputTokens: 120, temperature: 0.7 }
        })
      });
      let d = await r.json();
      let ans = d?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (ans) return ans;
    } catch(e) {}
  }

  // Instant Backup Server if Google Gemini has a High Demand traffic spike
  let sysPrompt = "You are Jarvis, Aditya's smart and polite personal AI assistant. Reply in natural Hinglish (1-2 short sentences, no emojis or asterisks). User says: " + userMsg;
  let bRes = await fetch("https://text.pollinations.ai/" + encodeURIComponent(sysPrompt));
  let bTxt = await bRes.text();
  if (bTxt && bTxt.trim()) return bTxt.trim();

  throw new Error("Internet connection check karein.");
}

async function send() {
  let inp = document.getElementById("t");
  let msg = inp.value.trim();
  if (!msg) return;

  if (msg.startsWith("AIzaSy") && msg.length > 30) {
    key = msg;
    localStorage.setItem("API_KEY", key);
    inp.value = "";
    document.getElementById("keyBox").style.display = "none";
    addMsg("API Key save ho gayi hai! Ab aap baat kar sakte hain.", "bot");
    speak("API Key save ho gayi hai.");
    return;
  }

  if (!key) {
    document.getElementById("keyBox").style.display = "flex";
    addMsg("Kripya upar Key box mein apni Gemini API Key paste karke Save dabayein.", "bot");
    return;
  }

  inp.value = "";
  addMsg(msg, "user");

  if (/photo banao|image banao|pic banao|generate image|draw/i.test(msg)) {
    generateImage(msg);
    return;
  }

  let userParts = [{text: msg}];
  if (currentPhotoBase64) {
    userParts.push({inlineData: {mimeType: currentPhotoMime, data: currentPhotoBase64}});
    currentPhotoBase64 = null;
  }
  chat.push({role:"user", parts: userParts});

  try {
    let ans = await getAIResponse(msg);
    ans = ans.replace(/[*#_~`]/g, "").trim();
    addMsg(ans, "bot");
    chat.push({role:"model", parts:[{text:ans}]});
    speak(ans);
  } catch(e) {
    chat.pop();
    addMsg("Error: " + e.message, "bot");
  }
}

function speak(txt) {
  isSpeaking = true;
  if (rec) { try { rec.stop(); } catch(e){} }
  if (currentAudio) { try { currentAudio.pause(); } catch(e){} }

  let doneSpeaking = () => {
    isSpeaking = false;
    if (autoMic && rec) {
      setTimeout(() => { try { rec.start(); } catch(e){} }, 400);
    }
  };

  let shortTxt = txt.substring(0, 190);
  let ttsUrl = "https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=hi&q=" + encodeURIComponent(shortTxt);
  let audio = new Audio(ttsUrl);
  currentAudio = audio;
  audio.playbackRate = 1.05;
  audio.onended = doneSpeaking;
  audio.onerror = () => {
    if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
      let u = new SpeechSynthesisUtterance(txt);
      u.lang = "hi-IN";
      u.rate = 1.05;
      u.onend = doneSpeaking;
      u.onerror = doneSpeaking;
      window.speechSynthesis.speak(u);
    } else {
      doneSpeaking();
    }
  };
  audio.play().catch(() => audio.onerror());
}

function addMsg(txt, cls) {
  let c = document.getElementById("chat");
  let d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerText = txt;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}
</script>
</body>
</html>
