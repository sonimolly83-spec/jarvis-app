<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis Final 3.8</title>
<style>
  body { background: #0b0f19; color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 14px; background: #111827; text-align: center; color: #38bdf8; font-weight: bold; font-size: 16px; }
  #chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
  .user { background: #0284c7; align-self: flex-end; }
  .bot { background: #1f2937; align-self: flex-start; }
  .bar { padding: 10px; background: #111827; display: flex; gap: 8px; }
  input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #374151; background: #0b0f19; color: #fff; outline: none; }
  button { background: #38bdf8; border: none; padding: 0 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<header>Jarvis Final 3.8</header>
<div id="chat">
  <div class="msg bot">Hello Aditya! Pehle message mein apni Gemini API Key paste karo.</div>
</div>
<div class="bar">
  <input type="text" id="t" placeholder="Type message or API Key..." onkeypress="if(event.key==='Enter') send()">
  <button onclick="send()">Send</button>
</div>
<script>
let key = localStorage.getItem("API_KEY") || "";
let chat = [
  {role:"user", parts:[{text:"You are Jarvis, a helpful AI assistant."}]},
  {role:"model", parts:[{text:"Hello! Ready."}]}
];

async function send() {
  let inp = document.getElementById("t");
  let val = inp.value.trim();
  if(!val) return;

  if(!key) {
    key = val;
    localStorage.setItem("API_KEY", key);
    inp.value = "";
    addMsg("API Key Saved Successfully!", "bot");
    return;
  }

  inp.value = "";
  addMsg(val, "user");
  chat.push({role:"user", parts:[{text:val}]});

  try {
    let r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=" + key, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ contents: chat.slice(-6) })
    });
    let d = await r.json();
    if(d.error) throw new Error(d.error.message);
    let ans = d.candidates[0].content.parts[0].text.trim();
    addMsg(ans, "bot");
    chat.push({role:"model", parts:[{text:ans}]});
    speak(ans);
  } catch(e) {
    chat.pop();
    addMsg("Error: " + e.message, "bot");
  }
}

function speak(txt) {
  if(window.speechSynthesis) {
    let u = new SpeechSynthesisUtterance(txt);
    u.lang = "en-US";
    window.speechSynthesis.speak(u);
  }
}

function addMsg(txt, cls) {
  let c = document.getElementById("chat");
  let d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerText = txt;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}
</script>
</body>
</html>
