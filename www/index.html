<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jarvis v2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body { background: #0b0f19; color: #fff; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 16px; background: #111827; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; }
  h2 { font-size: 16px; color: #38bdf8; }
  .key-btn { background: #1f2937; color: #38bdf8; border: 1px solid #38bdf8; padding: 6px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; }
  #keyBox { display: none; padding: 10px; background: #1f2937; gap: 8px; border-bottom: 1px solid #374151; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
  .user { background: #0284c7; align-self: flex-end; border-bottom-right-radius: 2px; }
  .bot { background: #1f2937; align-self: flex-start; border-bottom-left-radius: 2px; }
  .bar { padding: 10px 12px; background: #111827; display: flex; gap: 8px; border-top: 1px solid #1f2937; }
  input { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #374151; background: #0b0f19; color: #fff; outline: none; }
  button.send { background: #38bdf8; color: #000; border: none; width: 42px; height: 42px; border-radius: 50%; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h2>Jarvis v2 (Kanpuria AI)</h2>
  <button class="key-btn" onclick="toggleKey()">🔑 API Key</button>
</header>
<div id="keyBox">
  <input type="text" id="kInp" placeholder="AIzaSy... wali API Key yahan paste karein">
  <button class="key-btn" onclick="saveKey()">Save</button>
</div>
<div id="chat">
  <div class="msg bot">Arrey Aadi guru! Jarvis v2 chalu hai, batao ka haal chaal hain?</div>
</div>
<div class="bar">
  <input type="text" id="t" placeholder="Yahan likhein..." onkeypress="if(event.key==='Enter') send()">
  <button class="send" onclick="send()">➤</button>
</div>
<script>
let defaultKey = "";
try { defaultKey = atob("").trim(); } catch(e) {}
let key = (localStorage.getItem("API_KEY") || defaultKey || "").trim();

if (!key) {
  document.getElementById("keyBox").style.display = "flex";
}

function toggleKey() {
  let b = document.getElementById("keyBox");
  b.style.display = b.style.display === "flex" ? "none" : "flex";
  document.getElementById("kInp").value = key;
}

function saveKey() {
  key = document.getElementById("kInp").value.trim();
  localStorage.setItem("API_KEY", key);
  document.getElementById("keyBox").style.display = "none";
  addMsg("API Key save ho gayi guru! Ab baat karo.", "bot");
}

let chat = [
  {role:"user", parts:[{text:"Tu Aadi ki pakki Kanpuria female friend Jarvis hai. Super fast, natural Hinglish mein sirf 1 chhota sentence bol. Chill aur theth Kanpuria andaz rakh. No emoji, no stars."}]},
  {role:"model", parts:[{text:"Haan Aadi guru bol, ka scene hai?"}]}
];

async function send() {
  let inp = document.getElementById("t");
  let msg = inp.value.trim();
  if (!msg) return;
  if (!key) {
    document.getElementById("keyBox").style.display = "flex";
    addMsg("Guru upar wale box mein apni Gemini API Key paste karke Save daba do!", "bot");
    return;
  }
  inp.value = "";
  addMsg(msg, "user");
  chat.push({role:"user", parts:[{text:msg}]});

  try {
    let r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + key, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        contents: chat.slice(-6),
        generationConfig: { maxOutputTokens: 55, temperature: 0.75 }
      })
    });
    let d = await r.json();

    if (d.error) {
      throw new Error(d.error.message);
    }
    let ans = d?.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!ans) {
      throw new Error("Empty response aaya, dobara bhejo.");
    }
    ans = ans.trim();
    addMsg(ans, "bot");
    chat.push({role:"model", parts:[{text:ans}]});
    speak(ans);
  } catch(e) {
    chat.pop();
    addMsg("Dikkat aayi: " + e.message, "bot");
  }
}

function speak(txt) {
  try {
    let u = "https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=hi&q=" + encodeURIComponent(txt);
    let a = new Audio(u);
    a.play().catch(() => {
      if (window.speechSynthesis) {
        let s = new SpeechSynthesisUtterance(txt);
        s.lang = "hi-IN";
        window.speechSynthesis.speak(s);
      }
    });
  } catch(e) {}
}

function addMsg(txt, cls) {
  let c = document.getElementById("chat");
  let d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerText = txt;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}
</script>
</body>
</html>
