<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jarvis AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body { background: #0b0f19; color: #fff; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 16px; background: #111827; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; }
  h2 { font-size: 17px; color: #38bdf8; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
  .user { background: #0284c7; align-self: flex-end; border-bottom-right-radius: 2px; }
  .bot { background: #1f2937; align-self: flex-start; border-bottom-left-radius: 2px; }
  .bar { padding: 10px 12px; background: #111827; display: flex; gap: 8px; border-top: 1px solid #1f2937; }
  input { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #374151; background: #0b0f19; color: #fff; outline: none; }
  button { background: #38bdf8; border: none; width: 42px; height: 42px; border-radius: 50%; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h2>Jarvis AI</h2>
  <span style="color:#22c55e;font-size:12px;">● Live</span>
</header>
<div id="chat">
  <div class="msg bot">Haan Aadi bol, ka scene hai?</div>
</div>
<div class="bar">
  <input type="text" id="t" placeholder="Boliye ya likhein..." onkeypress="if(event.key==='Enter') send()">
  <button onclick="send()">➤</button>
</div>
<script>
let key = localStorage.getItem("API_KEY") || "";
if(!key) {
  key = prompt("Gemini API Key paste karein:");
  if(key) localStorage.setItem("API_KEY", key.trim());
}
let chat = [
  {role:"user", parts:[{text:"Tu Aadi ki female dost Jarvis hai. Fast 1-line natural Hinglish jawab de."}]},
  {role:"model", parts:[{text:"Haan Aadi bol!"}]}
];
async function send() {
  let inp = document.getElementById("t");
  let msg = inp.value.trim();
  if(!msg) return;
  inp.value = "";
  addMsg(msg, "user");
  chat.push({role:"user", parts:[{text:msg}]});
  try {
    let r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:chat.slice(-6), generationConfig:{maxOutputTokens:50, thinkingConfig:{thinkingBudget:0}}})
    });
    let d = await r.json();
    let ans = d.candidates[0].content.parts[0].text.trim();
    addMsg(ans, "bot");
    chat.push({role:"model", parts:[{text:ans}]});
    let audio = new Audio(`https://api.streamelements.com/kappa/v2/speech?voice=hi-IN-Wavenet-D&text=${encodeURIComponent(ans)}`);
    audio.play();
  } catch(e) {
    addMsg("Error: " + e.message, "bot");
  }
}
function addMsg(txt, cls) {
  let c = document.getElementById("chat");
  let d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerText = txt;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}
</script>
</body>
</html>
